name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  test:
    name: unittest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run test suite
        env:
          PYTHONPATH: src
        run: python -m unittest discover tests

  lint:
    # The suite cannot see an unimported name on a branch no test takes:
    # `ops.update_note` shipped a NameError in 0.5.4 that `ruff` reports as
    # F821 in under a second. Both tools are configured in pyproject.toml and
    # run through `uvx`, so neither becomes a declared dependency (§9).
    name: ruff + mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - name: Lint
        run: uvx ruff check src/
      - name: Type-check
        run: uvx mypy
