[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "cadabby"
version = "0.5.5"
description = "Zero-dependency engine for Karpathy-style LLM Wiki vaults with OKF trust tiers"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [
    {name = "Cadabby Contributors"}
]
keywords = ["llm-wiki", "knowledge-base", "mcp", "okf", "obsidian", "sqlite"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Topic :: Database",
]
dependencies = []

[project.scripts]
cadabby = "cadabby.cli:main"

[project.urls]
Documentation = "https://github.com/naikoob/cadabby#readme"
Issues = "https://github.com/naikoob/cadabby/issues"
Source = "https://github.com/naikoob/cadabby"

# Ruff and mypy are run from CI with `uvx`, so neither appears as a declared
# dependency and `dependencies = []` above stays literally true (§9).
[tool.ruff]
line-length = 140  # the longest line the tree already had was 147; six were wrapped to fit
target-version = "py311"

[tool.ruff.lint]
# BLE is listed because the tree already carries `# noqa: BLE001` on every
# deliberate blind except. Leaving it unselected made those directives dead
# text that `RUF100` then flagged -- the suppression and the rule have to
# travel together or neither means anything.
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "BLE"]

[tool.mypy]
python_version = "3.11"
files = ["src/cadabby"]
strict = true
# Turning these on is the follow-up to the port/row mismatch in §9.1: the
# `Any` leaks they flag are concentrated in the sqlite3.Row boundary, and
# silencing them here would hide exactly the drift the check is here to catch.
disallow_any_explicit = false
warn_return_any = true
