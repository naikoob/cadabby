[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "cadabby"
version = "0.2.0"
description = "Zero-dependency engine for Karpathy-style LLM Wiki vaults with OKF trust tiers"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [
    {name = "Cadabby Contributors"}
]
keywords = ["llm-wiki", "knowledge-base", "mcp", "okf", "obsidian", "sqlite"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Topic :: Database",
]
dependencies = []

[project.scripts]
cadabby = "cadabby.cli:main"

[project.urls]
Documentation = "https://github.com/bookian/cadabby#readme"
Issues = "https://github.com/bookian/cadabby/issues"
Source = "https://github.com/bookian/cadabby"
